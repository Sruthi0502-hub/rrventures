<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRventures Admin | Logging Out</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-shell" role="application">
    <div class="auth-panel">
      <div class="auth-card" style="text-align:center;">
        <div class="brand-block" style="justify-content:center;">
          <div class="brand-mark">RR</div>
        </div>
        <h2>Signing you out</h2>
        <p>You will be redirected to the login screen shortly.</p>
      </div>
    </div>
  </div>

  <script>
    const storageKeys = {
      token: 'rrventures_token',
      user: 'rrventures_user'
    };

    function clearSession() {
      localStorage.removeItem(storageKeys.token);
      localStorage.removeItem(storageKeys.user);
    }

    window.addEventListener('DOMContentLoaded', () => {
      clearSession();
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1300);
    });
  </script>
</body>
</html>

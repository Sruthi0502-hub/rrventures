<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRventures Admin | Logging Out</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="auth-shell" role="application">
    <div class="auth-panel">
      <div class="auth-card" style="text-align:center;">
        <div class="brand-block" style="justify-content:center;">
          <div class="brand-mark">RR</div>
        </div>
        <h2>Signing you out</h2>
        <p>You will be redirected to the login screen shortly.</p>
      </div>
    </div>
  </div>
  <a href="logout.html" class="logout-btn">Logout</a>
  <script>
    // FIXED: Storage keys matched exactly with scripts.js
    const storageKeys = {
      token: 'token',
      user: 'user'
    };

    function clearSession() {
      localStorage.removeItem(storageKeys.token);
      localStorage.removeItem(storageKeys.user);
    }

    window.addEventListener('DOMContentLoaded', () => {
      clearSession();
      // Fast redirect for better user experience
      setTimeout(() => {
        window.location.replace('index.html'); // replace keeps history clean
      }, 800);
    });
  </script>
</body>

</html>

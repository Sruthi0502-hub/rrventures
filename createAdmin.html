<div id="adminModal" class="modal"
    style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(10, 17, 26, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; transition: all 0.3s ease;">

    <div class="auth-card"
        style="background: #111c2a; border: 1px solid #233549; max-width: 480px; width: 90%; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.3s ease;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h3 style="margin: 0; color: #fff; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px;">Create New
                Admin Account</h3>
            <button id="closeAdminModal" type="button"
                style="background: none; border: none; color: #a0aec0; font-size: 2.2rem; cursor: pointer; line-height: 1; padding: 0; transition: color 0.2s;"
                onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#a0aec0'">&times;</button>
        </div>

        <div id="adminStatus" class="status-message"
            style="display:none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem; font-weight: 500; text-align: center; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);">
        </div>

        <form id="newAdminForm" autocomplete="off">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label
                    style="display: block; margin-bottom: 0.5rem; color: #a0aec0; font-size: 0.9rem; font-weight: 500;">Full
                    Name</label>
                <input type="text" id="adminName" placeholder="e.g. Ali Mawiya" required
                    style="width: 100%; padding: 0.85rem; border-radius: 10px; border: 1px solid #233549; background: rgba(255,255,255,0.02); color: #fff; outline: none; font-size: 0.95rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
                    onblur="this.style.borderColor='#233549'" />
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label
                    style="display: block; margin-bottom: 0.5rem; color: #a0aec0; font-size: 0.9rem; font-weight: 500;">Email
                    Address</label>
                <input type="email" id="adminEmail" placeholder="admin@rrventures.com" required
                    style="width: 100%; padding: 0.85rem; border-radius: 10px; border: 1px solid #233549; background: rgba(255,255,255,0.02); color: #fff; outline: none; font-size: 0.95rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
                    onblur="this.style.borderColor='#233549'" />
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label
                    style="display: block; margin-bottom: 0.5rem; color: #a0aec0; font-size: 0.9rem; font-weight: 500;">Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required
                    style="width: 100%; padding: 0.85rem; border-radius: 10px; border: 1px solid #233549; background: rgba(255,255,255,0.02); color: #fff; outline: none; font-size: 0.95rem; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='var(--primary, #3b82f6)'"
                    onblur="this.style.borderColor='#233549'" />
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; padding: 0.9rem; font-weight: 600; font-size: 1rem; border-radius: 10px; cursor: pointer; background: var(--primary, #3b82f6); color: #fff; border: none; transition: opacity 0.2s;"
                onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                Create Admin Account
            </button>
        </form>
    </div>
</div>
